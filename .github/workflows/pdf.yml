name: PDF and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.16'
          enable-cache: true
      - run: uv sync --locked
      - name: Install pinned Typst tools
        shell: uv run --locked python {0}
        run: |
          import hashlib, json, os, pathlib, tarfile, urllib.request
          config = json.loads(pathlib.Path('config/project.json').read_text())
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'typst-tools'
          target.mkdir()
          for name, spec in config['linux_tools'].items():
              archive = target/spec['url'].split('/')[-1]
              urllib.request.urlretrieve(spec['url'], archive)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == spec['sha256'], name
              if spec.get('archive'):
                  with tarfile.open(archive) as tar:
                      tar.extractall(target/name, filter='data')
                  executable = next(p for p in (target/name).rglob(name) if p.is_file())
                  (target/name).rename(target/(name+'-files'))
                  executable = target/(name+'-files')/executable.relative_to(target/name)
                  (target/name).symlink_to(executable)
              else:
                  archive.rename(target/name)
              (target/name).chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(target)+'\n')
      - name: Swap
        # A compile of the book takes more memory than the runner has: add
        # swap on the larger temporary disk when there is one.
        run: |
          set -euo pipefail
          swap_dir="$RUNNER_TEMP"
          if [[ -d /mnt ]] && (( $(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9) > 30 )); then
            swap_dir=/mnt
          fi
          check_swap="$swap_dir/mishchenko-fomenko-2000.swap"
          sudo fallocate -l 24G "$check_swap"
          sudo chmod 600 "$check_swap"
          sudo mkswap "$check_swap"
          sudo swapon "$check_swap"
          free -h
          df -h / /mnt || true
      - name: Diagnostics, typst compile
        continue-on-error: true
        env:
          TYPST_FONT_PATHS: assets/fonts
          TYPST_IGNORE_SYSTEM_FONTS: 'true'
        run: |
          nproc; free -m; swapon --show
          monitor() { while sleep 30; do echo "== $(date -u +%T)"; free -m | awk 'NR>1{print $1,$2,$3,$4,$7}'; ps -eo rss=,pcpu=,etime=,comm= --sort=-rss | head -3; done; }
          monitor & m=$!
          timeout -k 20s 12m /usr/bin/time -v typst compile --root . --input stage=final content/main.typ "$RUNNER_TEMP/book.pdf"
          status=$?
          kill $m
          exit $status
      - name: Diagnostics, tinymist lint
        continue-on-error: true
        env:
          TYPST_FONT_PATHS: assets/fonts
          TYPST_IGNORE_SYSTEM_FONTS: 'true'
        run: |
          monitor() { while sleep 30; do echo "== $(date -u +%T)"; free -m | awk 'NR>1{print $1,$2,$3,$4,$7}'; ps -eo rss=,pcpu=,etime=,comm= --sort=-rss | head -3; done; }
          monitor & m=$!
          timeout -k 20s 12m /usr/bin/time -v tinymist lint --diagnostic-format short --root . --input stage=final content/main.typ
          status=$?
          kill $m
          exit $status
      - name: Diagnostics only
        run: exit 1
      - name: Lint
        run: |
          set -euo pipefail
          (while sleep 60; do free -m | sed -n 2,3p | tr -s ' ' | paste -sd ' '; done) &
          /usr/bin/time -v uv run --locked python scripts/project.py lint
      - name: Check and build
        run: |
          set -euo pipefail
          (while sleep 60; do free -m | sed -n 2,3p | tr -s ' ' | paste -sd ' '; done) &
          /usr/bin/time -v uv run --locked python scripts/project.py check
      - name: Checksums of the published PDFs
        working-directory: build
        run: |
          sha256sum -- *.pdf > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mishchenko-fomenko-2000-pdfs
          path: |
            build/*.pdf
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: checks/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          leanchecker: 'true'
          leanchecker-args: '--fresh MishchenkoFomenko'
      - name: Check declaration axioms
        run: python3 checks/lean/check_axioms.py
  release:
    # Every commit on main is released: tag YYYY-MM-DD.N (build date in UTC
    # and build number), the PDFs and their SHA256SUMS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lean]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mishchenko-fomenko-2000-pdfs
          path: build
      - name: Require the complete edition
        run: python3 -c 'import json; assert json.load(open("config/project.json"))["stage"] == "final", "Releases require stage final"'
      - name: Publish the release of this commit
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          TITLE: Мищенко, Фоменко, Курс дифференциальной геометрии и топологии
        run: |
          if [[ -f SHA256SUMS ]]; then sha256sum --check SHA256SUMS; fi
          sha256sum -- *.pdf > SHA256SUMS
          date=$(date -u +%F)
          tag="$date.$BUILD"
          latest=false
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$SOURCE_SHA" ]]; then
            latest=true
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --latest="$latest" \
              --title "$TITLE · $date · build $BUILD" \
              --notes "Built on $date (UTC) from commit $SOURCE_SHA."
          fi
          gh release upload "$tag" ./*.pdf SHA256SUMS --clobber
